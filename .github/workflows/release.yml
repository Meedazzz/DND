name: Build and publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v2.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require tag to match package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$EXPECTED" || {
            echo "Release tag $RELEASE_TAG does not match package version $EXPECTED" >&2
            exit 1
          }
      - run: npm audit --omit=dev

  build:
    name: ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows NSIS x64
            os: windows-2025
            command: npx electron-builder --win nsis --x64 --publish never
            artifact: windows
            files: |
              release-build/*.exe
              release-build/*.exe.blockmap
              release-build/latest*.yml
          - label: Linux AppImage and DEB x64
            os: ubuntu-24.04
            command: npx electron-builder --linux AppImage deb --x64 --publish never
            artifact: linux
            files: |
              release-build/*.AppImage
              release-build/*.deb
              release-build/*.blockmap
              release-build/latest*.yml
          - label: macOS DMG and updater ZIP universal
            os: macos-15
            command: npx electron-builder --mac dmg zip --universal --publish never
            artifact: macos
            files: |
              release-build/*.dmg
              release-build/*.zip
              release-build/*.blockmap
              release-build/latest*.yml
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build native installer artifacts
        run: ${{ matrix.command }}
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release
          merge-multiple: true
      - name: Create SHA-256 manifest
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
