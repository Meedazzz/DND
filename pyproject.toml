[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-saga-battle"
version = "4.0.0"
description = "Драконья Сага — компактный Python-стол для D&D 5e"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6==6.9.2"]

[project.scripts]
dragon-saga = "dragon_saga.ui:run"
dragon-saga-server = "dragon_saga.server:main"

[tool.setuptools.packages.find]
include = ["dragon_saga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
